name: Web deployen

# Veröffentlicht die Webseite (web/) automatisch auf newsspur.de,
# sobald auf main etwas unter web/ geändert wird. Manuell startbar über
# "Run workflow" (auch vom Handy aus in der GitHub-App/Webseite).
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

# Nie zwei Deploys gleichzeitig; ein neuerer Push ersetzt einen wartenden.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Erst prüfen, dann veröffentlichen: ein roter Test stoppt den Deploy.
      - run: npm run typecheck
      - run: npm test
      - name: wrangler deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
