name: Weitblick

on:
  schedule:
    # Sonntag 16:15 UTC (= 18:15 Sommerzeit / 17:15 Winterzeit) - versetzt zum 30-Min-Nachrichtenlauf,
    # damit beide nicht gleichzeitig GDELT abfragen (sonst 429)
    - cron: '15 16 * * 0'
  workflow_dispatch: {}

jobs:
  lauf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run weitblick:run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # GDELT ist von GitHub-Servern nicht erreichbar -> Umweg ueber den Cloudflare-Worker
          GDELT_UMWEG_SCHLUESSEL: ${{ secrets.GDELT_UMWEG_SCHLUESSEL }}
